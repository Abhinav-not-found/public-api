name: Initialize Template

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  initialize:
    if: |
      github.event.repository.name != 'fullstack-template' &&
      !contains(github.event.head_commit.message, 'chore: initialize template')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace README
        run: |
          cat > README.md <<EOF
          # ${GITHUB_REPOSITORY#*/}

          > Built with the Fullstack Template.
          EOF

      - name: Remove initialization workflow
        run: |
          rm -f .github/workflows/initialize-template.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .github/workflows/initialize-template.yml

          git commit -m "chore: initialize template"

          git push